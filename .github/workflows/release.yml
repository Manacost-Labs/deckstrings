name: Release

on:
  workflow_dispatch:
    inputs:
      draft_tag:
        description: Existing draft release tag to stage after verification (leave empty for a dry-run)
        required: false
        type: string
      release_tag:
        description: Existing immutable release tag for an npm-only replay
        required: false
        type: string
      publish_existing_npm_release:
        description: Publish npm from an existing immutable release (requires release_tag)
        required: false
        type: boolean
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.release_tag || inputs.draft_tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      release-tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify versions and capture source revision
        id: source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || inputs.draft_tag }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease || 'false' }}
          REPLAY_EXISTING_NPM: ${{ inputs.publish_existing_npm_release }}
        run: |
          set -euo pipefail
          if [[ "${REPLAY_EXISTING_NPM}" == "true" && -z "${RELEASE_TAG}" ]]; then
            echo "npm replay requires release_tag." >&2
            exit 1
          fi
          python scripts/check_versions.py
          if [[ -n "${RELEASE_TAG}" ]]; then
            if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
              echo "Stable package publication cannot run from a prerelease." >&2
              exit 1
            fi
            python scripts/check_versions.py --tag "${RELEASE_TAG}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "version=$(python -c 'import json; print(json.load(open("package.json"))["version"])')" >> "${GITHUB_OUTPUT}"
          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Verify release commit and required CI
        if: github.event_name == 'release' || inputs.draft_tag != '' || inputs.publish_existing_npm_release
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY_EXISTING_NPM: ${{ inputs.publish_existing_npm_release }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin main:refs/remotes/origin/main
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [[ "${GITHUB_EVENT_NAME}" == "release" || "${REPLAY_EXISTING_NPM}" == "true" ]]; then
            if ! git merge-base --is-ancestor "${release_sha}" "${main_sha}"; then
              echo "Published release commit ${release_sha} is not on main." >&2
              exit 1
            fi
          elif [[ "${release_sha}" != "${main_sha}" ]]; then
            echo "Draft staging commit ${release_sha} is not the current main commit ${main_sha}." >&2
            exit 1
          fi
          required_checks=(
            lint
            typecheck
            test
            build
            fixtures-schema
            "php (8.2)"
            "php (8.3)"
            "php (8.4)"
            "php (8.5)"
            "python (3.10)"
            "python (3.11)"
            "python (3.12)"
            "python (3.13)"
            "python (3.14)"
            dotnet
            "CodeQL (javascript-typescript)"
            "CodeQL (python)"
            "CodeQL (csharp)"
          )
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/commits/${release_sha}/check-runs?filter=latest&per_page=100" \
            > "${RUNNER_TEMP}/check-runs.json"
          python - "${RUNNER_TEMP}/check-runs.json" "${required_checks[@]}" <<'PY'
          import json
          import sys

          path, *required = sys.argv[1:]
          check_runs = json.load(open(path, encoding="utf-8"))["check_runs"]
          for name in required:
              candidates = [
                  check
                  for check in check_runs
                  if check["name"] == name
                  and check.get("app", {}).get("id") == 15368
              ]
              if not candidates:
                  raise SystemExit(f"Required GitHub Actions check is missing: {name}")
              latest = max(candidates, key=lambda check: check["id"])
              if latest["status"] != "completed" or latest["conclusion"] != "success":
                  raise SystemExit(
                      f"Latest required check did not succeed: {name} "
                      f"({latest['status']}/{latest['conclusion']})"
                  )
          PY

  build-npm:
    name: Build npm artifact
    if: github.event_name == 'workflow_dispatch' && !inputs.publish_existing_npm_release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.source-sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: corepack enable
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:package
      - run: mkdir -p artifacts/npm && npm pack --ignore-scripts --pack-destination artifacts/npm

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-artifacts
          path: artifacts/npm
          if-no-files-found: error
          retention-days: 14

  build-python:
    name: Build Python artifact
    if: github.event_name == 'workflow_dispatch' && !inputs.publish_existing_npm_release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.source-sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: packages/python/uv.lock

      - run: uv sync --project packages/python --locked --all-extras
      - run: uv run --project packages/python --locked --all-extras pytest packages/python/tests -q
      - run: uv run --project packages/python --locked --all-extras ruff check packages/python
      - run: uv run --project packages/python --locked --all-extras ruff format --check packages/python
      - run: uv run --project packages/python --locked --all-extras mypy packages/python/src
      - run: mkdir -p artifacts/python && uv run --project packages/python --locked --all-extras python -m build packages/python --no-isolation --outdir artifacts/python
      - run: uv run --project packages/python --locked --all-extras twine check artifacts/python/*
      - name: Test the built wheel in a clean environment
        run: |
          python -m venv "${RUNNER_TEMP}/python-consumer"
          "${RUNNER_TEMP}/python-consumer/bin/python" -m pip install --no-deps artifacts/python/*.whl
          "${RUNNER_TEMP}/python-consumer/bin/python" -c 'from manacost_deckstrings import decode, encode, parse_export; value="AAEBAQcBBAMBAgMAAA=="; assert encode(decode(value)) == value; assert parse_export(value)["deckstring"] == value'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-artifacts
          path: artifacts/python
          if-no-files-found: error
          retention-days: 14

  build-nuget:
    name: Build NuGet artifacts
    if: github.event_name == 'workflow_dispatch' && !inputs.publish_existing_npm_release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.source-sha }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build library for all target frameworks
        run: dotnet build packages/dotnet/src/ManacostLabs.Deckstrings/ManacostLabs.Deckstrings.csproj --configuration Release
      - name: Run .NET 8 and .NET 10 unit tests
        run: dotnet test packages/dotnet/tests/ManacostLabs.Deckstrings.Tests/ManacostLabs.Deckstrings.Tests.csproj --configuration Release
      - name: Run all shared fixtures
        run: dotnet run --project packages/dotnet/tests/ManacostLabs.Deckstrings.Compatibility/ManacostLabs.Deckstrings.Compatibility.csproj --configuration Release -- fixtures/deckstrings.json
      - name: Pack NuGet and symbols packages
        run: dotnet pack packages/dotnet/src/ManacostLabs.Deckstrings/ManacostLabs.Deckstrings.csproj --configuration Release --no-build --output artifacts/nuget
      - name: Install the built package in clean consumers
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          dotnet run --project packages/dotnet/tests/ManacostLabs.Deckstrings.Consumer/ManacostLabs.Deckstrings.Consumer.csproj --configuration Release --framework net8.0 -p:DeckstringsPackageSource="${GITHUB_WORKSPACE}/artifacts/nuget" -p:DeckstringsPackageVersion="${RELEASE_VERSION}"
          dotnet run --project packages/dotnet/tests/ManacostLabs.Deckstrings.Consumer/ManacostLabs.Deckstrings.Consumer.csproj --configuration Release --framework net10.0 -p:DeckstringsPackageSource="${GITHUB_WORKSPACE}/artifacts/nuget" -p:DeckstringsPackageVersion="${RELEASE_VERSION}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-artifacts
          path: artifacts/nuget
          if-no-files-found: error
          retention-days: 14

  test-composer:
    name: Test Composer package
    if: github.event_name == 'workflow_dispatch' && !inputs.publish_existing_npm_release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.source-sha }}

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
          tools: composer:2.10.2
          coverage: none

      - run: composer validate --strict --check-lock --no-plugins
      - run: composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
      - run: composer check
      - name: Audit Composer dependencies
        run: |
          for attempt in 1 2 3; do
            if composer audit --locked --no-plugins; then
              exit 0
            else
              status=$?
            fi
            if [[ "${status}" -ne 100 || "${attempt}" -eq 3 ]]; then
              exit "${status}"
            fi
            sleep "$((attempt * 5))"
          done

  build-composer:
    name: Build Composer artifact
    if: github.event_name == 'workflow_dispatch' && !inputs.publish_existing_npm_release
    needs:
      - verify
      - test-composer
    runs-on: ubuntu-latest
    env:
      COMPOSER_ROOT_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.source-sha }}

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
          tools: composer:2.10.2
          coverage: none

      - run: composer validate --strict --check-lock --no-plugins
      - name: Build and verify versioned Composer archive
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          composer_archive_dir="${RUNNER_TEMP}/composer-artifact"
          archive_name="manacost-labs-hearthstone-deckstrings-${RELEASE_VERSION}.zip"
          mkdir -p "${composer_archive_dir}" artifacts/composer
          composer archive --format=zip \
            --dir="${composer_archive_dir}" \
            --file="manacost-labs-hearthstone-deckstrings-${RELEASE_VERSION}" \
            --no-plugins --no-scripts
          source_archive="${composer_archive_dir}/${archive_name}"
          archive="artifacts/composer/${archive_name}"
          test -f "${source_archive}"
          mv "${source_archive}" "${archive}"
          test -f "${archive}"
          unzip -Z1 "${archive}" | sed '/\/$/d' | LC_ALL=C sort > "${RUNNER_TEMP}/composer-archive-actual"
          cat > "${RUNNER_TEMP}/composer-archive-expected" <<'EOF'
          CHANGELOG.md
          LICENSE
          README.md
          SECURITY.md
          composer.json
          packages/php/src/DeckstringException.php
          packages/php/src/Deckstrings.php
          EOF
          diff -u "${RUNNER_TEMP}/composer-archive-expected" "${RUNNER_TEMP}/composer-archive-actual"
          package_dir="${RUNNER_TEMP}/composer-package"
          consumer_dir="${RUNNER_TEMP}/composer-consumer"
          mkdir -p "${package_dir}" "${consumer_dir}"
          unzip -q "${archive}" -d "${package_dir}"
          cat > "${consumer_dir}/composer.json" <<EOF
          {
            "repositories": [
              {
                "type": "path",
                "url": "${package_dir}",
                "options": { "symlink": false }
              }
            ],
            "require": {
              "manacost-labs/hearthstone-deckstrings": "dev-main"
            },
            "minimum-stability": "dev"
          }
          EOF
          composer install --working-dir="${consumer_dir}" \
            --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
          php -r 'require $argv[1]; $value = "AAEBAQcBBAMBAgMAAA=="; $deck = ManacostLabs\Deckstrings\Deckstrings::decode($value); if (ManacostLabs\Deckstrings\Deckstrings::encode($deck) !== $value) { throw new RuntimeException("Composer consumer round-trip failed."); }' \
            "${consumer_dir}/vendor/autoload.php"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: composer-artifacts
          path: artifacts/composer
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble release artifacts
    if: github.event_name == 'workflow_dispatch' && !inputs.publish_existing_npm_release
    needs:
      - verify
      - build-npm
      - build-python
      - build-nuget
      - build-composer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.source-sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-artifacts
          path: artifacts/npm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-artifacts
          path: artifacts/python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-artifacts
          path: artifacts/nuget
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: composer-artifacts
          path: artifacts/composer

      - name: Generate and verify release metadata
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          SOURCE_SHA: ${{ needs.verify.outputs.source-sha }}
        run: |
          python -m unittest discover -s scripts/tests -p 'test_*.py'
          python scripts/generate_release_metadata.py \
            --artifacts artifacts \
            --version "${RELEASE_VERSION}" \
            --source-sha "${SOURCE_SHA}" \
            --build-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          uvx --from spdx-tools==0.8.5 pyspdxtools \
            -i artifacts/sbom.spdx.json
          test "$(jq '.packages | length' artifacts/sbom.spdx.json)" -eq 4
          test "$(jq '.files | length' artifacts/sbom.spdx.json)" -eq 6
          test "$(jq '[.relationships[] | select(.relationshipType == "DISTRIBUTION_ARTIFACT")] | length' artifacts/sbom.spdx.json)" -eq 6
          mkdir release-bundle
          find artifacts -mindepth 2 -type f -exec cp {} release-bundle/ \;
          cp artifacts/sbom.spdx.json artifacts/SHA256SUMS release-bundle/
          test "$(find release-bundle -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 8
          (cd release-bundle && sha256sum --check --strict SHA256SUMS)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: release-bundle
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Attest release artifacts
    if: github.event_name == 'workflow_dispatch' && !inputs.publish_existing_npm_release
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: artifacts

      - name: Verify downloaded release bundle
        working-directory: artifacts
        run: sha256sum --check --strict SHA256SUMS

      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/*.tgz
            artifacts/*.whl
            artifacts/*.tar.gz
            artifacts/*.nupkg
            artifacts/*.snupkg
            artifacts/*.zip

      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/*.tgz
            artifacts/*.whl
            artifacts/*.tar.gz
            artifacts/*.nupkg
            artifacts/*.snupkg
            artifacts/*.zip
          sbom-path: artifacts/sbom.spdx.json

  stage-draft-assets:
    name: Stage verified draft release assets
    if: github.event_name == 'workflow_dispatch' && inputs.draft_tag != ''
    needs:
      - verify
      - assemble
      - attest
    runs-on: ubuntu-latest
    environment:
      name: release-staging
      url: https://github.com/Manacost-Labs/deckstrings/releases
    permissions:
      attestations: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.source-sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: artifacts

      - name: Verify bundle and build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          SOURCE_SHA: ${{ needs.verify.outputs.source-sha }}
        run: |
          set -euo pipefail
          python scripts/verify_release_bundle.py \
            --artifacts artifacts \
            --version "${RELEASE_VERSION}" \
            --source-sha "${SOURCE_SHA}"
          verify_build_attestation() {
            local artifact="$1"
            for attempt in {1..12}; do
              if gh attestation verify "${artifact}" \
                --repo "${GITHUB_REPOSITORY}" \
                --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
                --source-digest "${SOURCE_SHA}" \
                --source-ref refs/heads/main \
                --deny-self-hosted-runners >/dev/null; then
                return 0
              fi
              sleep 5
            done
            echo "Build attestation did not verify: ${artifact}" >&2
            return 1
          }
          for artifact in \
            artifacts/*.tgz \
            artifacts/*.whl \
            artifacts/*.tar.gz \
            artifacts/*.nupkg \
            artifacts/*.snupkg \
            artifacts/*.zip; do
            verify_build_attestation "${artifact}"
          done

      - name: Upload the exact bundle to the existing draft
        env:
          DRAFT_TAG: ${{ needs.verify.outputs.release-tag }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.verify.outputs.source-sha }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > "${RUNNER_TEMP}/release-pages.json"
          jq 'add' "${RUNNER_TEMP}/release-pages.json" \
            > "${RUNNER_TEMP}/releases.json"
          jq --arg tag "${DRAFT_TAG}" \
            '[.[] | select(.tag_name == $tag)]' \
            "${RUNNER_TEMP}/releases.json" > "${RUNNER_TEMP}/matches.json"
          test "$(jq 'length' "${RUNNER_TEMP}/matches.json")" -eq 1
          jq '.[0]' "${RUNNER_TEMP}/matches.json" > "${RUNNER_TEMP}/release.json"
          jq -e \
            --arg sha "${SOURCE_SHA}" \
            '.draft == true and .prerelease == false and .immutable == false and .target_commitish == $sha' \
            "${RUNNER_TEMP}/release.json" >/dev/null
          release_id="$(jq -r '.id' "${RUNNER_TEMP}/release.json")"

          find artifacts -mindepth 1 -maxdepth 1 -type f \
            -exec basename {} \; | LC_ALL=C sort > "${RUNNER_TEMP}/expected-assets"
          jq -r '.assets[].name' "${RUNNER_TEMP}/release.json" \
            | LC_ALL=C sort > "${RUNNER_TEMP}/existing-assets"
          LC_ALL=C comm -13 "${RUNNER_TEMP}/expected-assets" "${RUNNER_TEMP}/existing-assets" \
            > "${RUNNER_TEMP}/unexpected-assets"
          if [[ -s "${RUNNER_TEMP}/unexpected-assets" ]]; then
            echo "The draft contains an unexpected release asset." >&2
            cat "${RUNNER_TEMP}/unexpected-assets" >&2
            exit 1
          fi

          while IFS= read -r asset_name; do
            asset_path="artifacts/${asset_name}"
            local_digest="sha256:$(sha256sum "${asset_path}" | cut -d ' ' -f 1)"
            gh api "/repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              > "${RUNNER_TEMP}/current-release.json"
            asset_count="$(jq --arg name "${asset_name}" \
              '[.assets[] | select(.name == $name)] | length' \
              "${RUNNER_TEMP}/current-release.json")"
            if [[ "${asset_count}" -eq 1 ]]; then
              asset_state="$(jq -r --arg name "${asset_name}" \
                '.assets[] | select(.name == $name) | .state' \
                "${RUNNER_TEMP}/current-release.json")"
              asset_size="$(jq -r --arg name "${asset_name}" \
                '.assets[] | select(.name == $name) | .size' \
                "${RUNNER_TEMP}/current-release.json")"
              if [[ "${asset_state}" == "starter" && "${asset_size}" -eq 0 ]]; then
                stale_asset_id="$(jq -r --arg name "${asset_name}" \
                  '.assets[] | select(.name == $name) | .id' \
                  "${RUNNER_TEMP}/current-release.json")"
                gh api --method DELETE \
                  "/repos/${GITHUB_REPOSITORY}/releases/assets/${stale_asset_id}"
                asset_count=0
              fi
            fi
            if [[ "${asset_count}" -eq 1 ]]; then
              remote_digest="$(jq -r --arg name "${asset_name}" \
                '.assets[] | select(.name == $name) | .digest' \
                "${RUNNER_TEMP}/current-release.json")"
              if [[ "${asset_state}" != "uploaded" || "${remote_digest}" != "${local_digest}" ]]; then
                echo "Existing draft asset digest mismatch: ${asset_name}" >&2
                exit 1
              fi
            elif [[ "${asset_count}" -eq 0 ]]; then
              upload_url="$(jq -r '.upload_url' "${RUNNER_TEMP}/release.json")"
              upload_url="${upload_url%%\{*}"
              encoded_name="$(jq -rn --arg name "${asset_name}" '$name | @uri')"
              gh api --method POST \
                -H 'Content-Type: application/octet-stream' \
                --input "${asset_path}" \
                "${upload_url}?name=${encoded_name}" >/dev/null
            else
              echo "Duplicate draft asset name: ${asset_name}" >&2
              exit 1
            fi
          done < "${RUNNER_TEMP}/expected-assets"

          gh api "/repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            > "${RUNNER_TEMP}/staged-release.json"
          jq -e \
            --arg sha "${SOURCE_SHA}" \
            --arg tag "${DRAFT_TAG}" \
            '.draft == true and .prerelease == false and .immutable == false and .tag_name == $tag and .target_commitish == $sha' \
            "${RUNNER_TEMP}/staged-release.json" >/dev/null
          jq -r '.assets[].name' "${RUNNER_TEMP}/staged-release.json" \
            | LC_ALL=C sort > "${RUNNER_TEMP}/staged-assets"
          diff -u "${RUNNER_TEMP}/expected-assets" "${RUNNER_TEMP}/staged-assets"
          while IFS= read -r asset_name; do
            local_digest="sha256:$(sha256sum "artifacts/${asset_name}" | cut -d ' ' -f 1)"
            remote_digest="$(jq -r --arg name "${asset_name}" \
              '.assets[] | select(.name == $name) | .digest' \
              "${RUNNER_TEMP}/staged-release.json")"
            test "${remote_digest}" = "${local_digest}"
          done < "${RUNNER_TEMP}/expected-assets"

  verify-published-assets:
    name: Verify immutable published release assets
    if: github.event_name == 'release' || inputs.publish_existing_npm_release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.source-sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify immutable release identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}
          SOURCE_SHA: ${{ needs.verify.outputs.source-sha }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > "${RUNNER_TEMP}/release.json"
          jq -e \
            --arg sha "${SOURCE_SHA}" \
            --arg tag "${RELEASE_TAG}" \
            '.draft == false and .prerelease == false and .immutable == true and .tag_name == $tag and .target_commitish == $sha' \
            "${RUNNER_TEMP}/release.json" >/dev/null

          verified=false
          for attempt in {1..12}; do
            if gh release verify "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" >/dev/null; then
              verified=true
              break
            fi
            sleep 5
          done
          if [[ "${verified}" != "true" ]]; then
            echo "The immutable GitHub Release attestation was not available." >&2
            exit 1
          fi

      - name: Download and verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          SOURCE_SHA: ${{ needs.verify.outputs.source-sha }}
        run: |
          set -euo pipefail
          mkdir published-assets
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir published-assets
          python scripts/verify_release_bundle.py \
            --artifacts published-assets \
            --version "${RELEASE_VERSION}" \
            --source-sha "${SOURCE_SHA}"

          gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > "${RUNNER_TEMP}/release.json"
          while IFS= read -r asset_path; do
            asset_name="$(basename "${asset_path}")"
            local_digest="sha256:$(sha256sum "${asset_path}" | cut -d ' ' -f 1)"
            remote_digest="$(jq -r --arg name "${asset_name}" \
              '.assets[] | select(.name == $name) | .digest' \
              "${RUNNER_TEMP}/release.json")"
            test "${remote_digest}" = "${local_digest}"
            gh release verify-asset "${RELEASE_TAG}" "${asset_path}" \
              --repo "${GITHUB_REPOSITORY}" >/dev/null
          done < <(find published-assets -mindepth 1 -maxdepth 1 -type f | LC_ALL=C sort)

          for artifact in \
            published-assets/*.tgz \
            published-assets/*.whl \
            published-assets/*.tar.gz \
            published-assets/*.nupkg \
            published-assets/*.snupkg \
            published-assets/*.zip; do
            gh attestation verify "${artifact}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-digest "${SOURCE_SHA}" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners >/dev/null
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-release-artifacts
          path: published-assets
          if-no-files-found: error
          retention-days: 14

  publish-npm:
    name: Publish npm
    if: github.event_name == 'release' || inputs.publish_existing_npm_release
    needs:
      - verify
      - verify-published-assets
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/@manacost-labs/deckstrings
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: published-release-artifacts
          path: artifacts
      - name: Verify downloaded release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}
        working-directory: artifacts
        run: |
          sha256sum --check --strict SHA256SUMS
          gh release verify-asset "${RELEASE_TAG}" ./*.tgz \
            --repo "${GITHUB_REPOSITORY}" >/dev/null
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install OIDC-capable npm CLI
        run: npm install --global npm@11.6.2
      - run: npm publish "./$(find artifacts -maxdepth 1 -type f -name '*.tgz' -print -quit)" --access public

  publish-pypi:
    name: Publish PyPI
    if: github.event_name == 'release'
    needs:
      - verify
      - verify-published-assets
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/manacost-deckstrings/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: published-release-artifacts
          path: artifacts
      - name: Verify downloaded release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}
        working-directory: artifacts
        run: |
          sha256sum --check --strict SHA256SUMS
          for artifact in ./*.whl ./*.tar.gz; do
            gh release verify-asset "${RELEASE_TAG}" "${artifact}" \
              --repo "${GITHUB_REPOSITORY}" >/dev/null
          done
      - name: Select Python distributions
        run: |
          mkdir python-dist
          cp artifacts/*.whl artifacts/*.tar.gz python-dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: python-dist

  publish-nuget:
    name: Publish NuGet
    if: github.event_name == 'release'
    needs:
      - verify
      - verify-published-assets
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.nuget.org/packages/ManacostLabs.Deckstrings
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: published-release-artifacts
          path: artifacts
      - name: Verify downloaded release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}
        working-directory: artifacts
        run: |
          sha256sum --check --strict SHA256SUMS
          for artifact in ./*.nupkg ./*.snupkg; do
            gh release verify-asset "${RELEASE_TAG}" "${artifact}" \
              --repo "${GITHUB_REPOSITORY}" >/dev/null
          done
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Request short-lived NuGet key
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish package and symbols
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(find artifacts -maxdepth 1 -type f \
            -name '*.nupkg' ! -name '*.snupkg' -print)
          test "${#packages[@]}" -eq 1
          dotnet nuget push "${packages[0]}" \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json
