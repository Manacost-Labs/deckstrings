name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: npm run type-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:browser

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:package
      - run: npm run pack:inspect

  fixtures-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: packages/python/uv.lock
      - run: uv sync --project packages/python --locked --all-extras
      - run: uv run --project packages/python --locked --all-extras python scripts/validate_fixtures.py
      - run: python scripts/check_versions.py
      - run: python -m unittest discover -s scripts/tests -p 'test_*.py'

  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:2.10.2
          coverage: none
      - run: composer validate --strict --check-lock --no-plugins
      - run: composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
      - run: composer check
      - run: composer audit --locked --no-plugins
      - name: Build and verify clean Composer archive
        env:
          COMPOSER_ROOT_VERSION: 1.0.0
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/composer-artifact"
          package_dir="${RUNNER_TEMP}/composer-package"
          consumer_dir="${RUNNER_TEMP}/composer-consumer"
          mkdir -p "${artifact_dir}" "${package_dir}" "${consumer_dir}"
          composer archive --format=zip --dir="${artifact_dir}" \
            --file=manacost-labs-hearthstone-deckstrings-ci \
            --no-plugins --no-scripts
          archive="${artifact_dir}/manacost-labs-hearthstone-deckstrings-ci.zip"
          test -f "${archive}"
          unzip -Z1 "${archive}" | sed '/\/$/d' | LC_ALL=C sort > "${RUNNER_TEMP}/composer-archive-actual"
          cat > "${RUNNER_TEMP}/composer-archive-expected" <<'EOF'
          CHANGELOG.md
          LICENSE
          README.md
          SECURITY.md
          composer.json
          packages/php/src/DeckstringException.php
          packages/php/src/Deckstrings.php
          EOF
          diff -u "${RUNNER_TEMP}/composer-archive-expected" "${RUNNER_TEMP}/composer-archive-actual"
          unzip -q "${archive}" -d "${package_dir}"
          cat > "${consumer_dir}/composer.json" <<EOF
          {
            "repositories": [
              {
                "type": "path",
                "url": "${package_dir}",
                "options": { "symlink": false }
              }
            ],
            "require": {
              "manacost-labs/hearthstone-deckstrings": "dev-main"
            },
            "minimum-stability": "dev"
          }
          EOF
          composer install --working-dir="${consumer_dir}" \
            --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
          php -r 'require $argv[1]; $value = "AAEBAQcBBAMBAgMAAA=="; $deck = ManacostLabs\Deckstrings\Deckstrings::decode($value); if (ManacostLabs\Deckstrings\Deckstrings::encode($deck) !== $value) { throw new RuntimeException("Composer consumer round-trip failed."); }' \
            "${consumer_dir}/vendor/autoload.php"

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: packages/python/uv.lock
      - run: uv sync --project packages/python --locked --all-extras
      - run: uv run --project packages/python --locked --all-extras pytest packages/python/tests -q
      - run: uv run --project packages/python --locked --all-extras ruff check packages/python
      - run: uv run --project packages/python --locked --all-extras ruff format --check packages/python
      - run: uv run --project packages/python --locked --all-extras mypy packages/python/src
      - run: uv run --project packages/python --locked --all-extras python -m build packages/python --no-isolation --outdir "${RUNNER_TEMP}/python-artifact"
      - run: uv run --project packages/python --locked --all-extras twine check "${RUNNER_TEMP}"/python-artifact/*
      - name: Test the built wheel in a clean environment
        run: |
          python -m venv "${RUNNER_TEMP}/python-consumer"
          "${RUNNER_TEMP}/python-consumer/bin/python" -m pip install --no-deps "${RUNNER_TEMP}"/python-artifact/*.whl
          "${RUNNER_TEMP}/python-consumer/bin/python" -c 'from manacost_deckstrings import decode, encode; value="AAEBAQcBBAMBAgMAAA=="; assert encode(decode(value)) == value'

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build library for all target frameworks
        run: dotnet build packages/dotnet/src/ManacostLabs.Deckstrings/ManacostLabs.Deckstrings.csproj --configuration Release
      - name: Run .NET 8 and .NET 10 unit tests
        run: dotnet test packages/dotnet/tests/ManacostLabs.Deckstrings.Tests/ManacostLabs.Deckstrings.Tests.csproj --configuration Release
      - name: Run all shared fixtures
        run: dotnet run --project packages/dotnet/tests/ManacostLabs.Deckstrings.Compatibility/ManacostLabs.Deckstrings.Compatibility.csproj --configuration Release -- fixtures/deckstrings.json
      - name: Pack NuGet and symbols packages
        run: dotnet pack packages/dotnet/src/ManacostLabs.Deckstrings/ManacostLabs.Deckstrings.csproj --configuration Release --no-build
      - name: Build ASP.NET example against the packed package
        run: |
          package_version="$(dotnet msbuild packages/dotnet/src/ManacostLabs.Deckstrings/ManacostLabs.Deckstrings.csproj -getProperty:Version -verbosity:quiet | tail -1)"
          package_source="${GITHUB_WORKSPACE}/packages/dotnet/src/ManacostLabs.Deckstrings/bin/Release"
          dotnet restore examples/dotnet/aspnet/DeckstringsApi.csproj \
            --source "${package_source}" \
            -p:DeckstringsPackageVersion="${package_version}"
          dotnet build examples/dotnet/aspnet/DeckstringsApi.csproj \
            --configuration Release \
            --no-restore \
            -p:DeckstringsPackageVersion="${package_version}"
      - name: Install the built package in clean consumers
        run: |
          package_version="$(dotnet msbuild packages/dotnet/src/ManacostLabs.Deckstrings/ManacostLabs.Deckstrings.csproj -getProperty:Version -verbosity:quiet | tail -1)"
          package_source="${GITHUB_WORKSPACE}/packages/dotnet/src/ManacostLabs.Deckstrings/bin/Release"
          dotnet run --project packages/dotnet/tests/ManacostLabs.Deckstrings.Consumer/ManacostLabs.Deckstrings.Consumer.csproj --configuration Release --framework net8.0 -p:DeckstringsPackageSource="${package_source}" -p:DeckstringsPackageVersion="${package_version}"
          dotnet run --project packages/dotnet/tests/ManacostLabs.Deckstrings.Consumer/ManacostLabs.Deckstrings.Consumer.csproj --configuration Release --framework net10.0 -p:DeckstringsPackageSource="${package_source}" -p:DeckstringsPackageVersion="${package_version}"
